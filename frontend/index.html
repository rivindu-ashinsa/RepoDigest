<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README Generator UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-dark.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="app-shell">
    <header class="glass panel header-panel">
      <div>
        <p class="eyebrow">Agentic AI</p>
        <h1>README Generator</h1>
      </div>
      <p class="subtitle">Generate GitHub-ready README.md from a repository with real-time scan logs.</p>
    </header>

    <section class="glass panel control-panel">
      <form id="generate-form" class="form-grid">
        <label class="field field-wide">
          <span>Repository URL</span>
          <input id="repo-url" type="url" placeholder="https://github.com/owner/repo" required />
        </label>

        <label class="field toggle-field">
          <span>Use HuggingFace model (default)</span>
          <input id="use-hf" type="checkbox" checked />
        </label>

        <button id="generate-btn" type="submit">Generate README</button>
      </form>

      <div class="status-row">
        <div id="live-status" class="pill">Idle</div>
        <div id="progress-text" class="pill subtle">0 / 0 files</div>
      </div>
      <div class="progress-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </section>

    <section class="content-grid">
      <article class="glass panel logs-panel">
        <div class="panel-head">
          <h2>System Logs</h2>
          <button id="clear-logs-btn" type="button">Clear</button>
        </div>
        <div id="logs" class="logs" aria-live="polite"></div>
      </article>

      <article class="glass panel markdown-panel">
        <div class="panel-head">
          <h2>README Preview (GitHub style)</h2>
          <button id="copy-md-btn" type="button" disabled>Copy .md</button>
        </div>
        <div id="markdown-container" class="markdown-host">
          <article id="markdown-output" class="markdown-body"></article>
        </div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
